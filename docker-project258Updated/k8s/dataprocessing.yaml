apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataprocessing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dataprocessing
  template:
    metadata:
      labels:
        app: dataprocessing
    spec:
      containers:
      - name: dataprocessing
        image: dataprocessing:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: "100m"
          limits:
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: dataprocessing
spec:
  selector:
    app: dataprocessing
  ports:
  - port: 5000
    targetPort: 5000
apiVersion: apps/v1
kind: Deployment
metadata:
  name: userprofileservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: userprofileservice
  template:
    metadata:
      labels:
        app: userprofileservice
    spec:
      containers:
      - name: userprofileservice
        image: userprofileservice:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: userprofileservice
spec:
  selector:
    app: userprofileservice
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
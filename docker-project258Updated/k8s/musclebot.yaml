apiVersion: apps/v1
kind: Deployment
metadata:
  name: musclebot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: musclebot
  template:
    metadata:
      labels:
        app: musclebot
    spec:
      containers:
      - name: musclebot
        image: musclebot:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: musclebot
spec:
  selector:
    app: musclebot
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
services:
  # Discord Bot serving as main terminal for the user
  musclebot:
    build:
      context: ./ContainerMuscleBot/MuscleBot
      dockerfile: Dockerfile
    container_name: musclebot
    depends_on:
      - dataprocessing
    restart: unless-stopped
    volumes:
      - ./ContainerMuscleBot/MuscleBot/config:/app/config

  # Service to manages all interactions in regards to user profiles for our API
  userprofileservice:
    build:
      context: ./ContainerUserProfile/UserProfileService
      dockerfile: Dockerfile
    container_name: userprofileservice
    restart: unless-stopped
    volumes:
      - ./Databases:/app/data


  # Service to manages Ingestion of feeds from Bluesky
  dataingestionbluesky:
    build:
      context: ./dataingestionbluesky
      dockerfile: Dockerfile
    container_name: dataingestionbluesky
    restart: unless-stopped
    
  # Service to manages Ingestion of feeds from Mastodon
  dataingestionmastodon:
    build:
      context: ./dataIngestionMastodon
      dockerfile: Dockerfile
    container_name: dataingestionmastodon
    restart: unless-stopped
    
  # Service to processes feeds into a digestable form
  dataprocessing:
    build:
      context: ./dataprocessing
      dockerfile: Dockerfile
    container_name: dataprocessing
    restart: unless-stopped
    
  # Service the manages the log database
  logdatabase:
    build: ./ContainerLogDatabase
    container_name: logdatabase
    volumes:
      - ./Databases:/app/data

  # Web interface for viewing processed Bluesky data
  webinterface:
    build:
      context: ../JSON_docker
      dockerfile: Web_Interface/Dockerfile
    container_name: webinterface
    ports:
      - "8000:8000"
    environment:
      - INGEST_Bluesky_HOST=dataingestionbluesky
      - INGEST_Mastodon_HOST=dataingestionmastodon
    depends_on:
      - dataingestionbluesky
      - dataingestionmastodon
    restart: unless-stopped   